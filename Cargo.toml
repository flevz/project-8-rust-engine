[workspace]
members = ["crates/p8-sim", "crates/p8-formats", "crates/p8-skater", "crates/p8-game"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
bevy = "0.18.1"
glam = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
p8-sim = { path = "crates/p8-sim" }
p8-formats = { path = "crates/p8-formats" }
p8-skater = { path = "crates/p8-skater" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
